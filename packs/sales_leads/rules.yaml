version: 1
rules:
  - id: SPAM_OR_AUTO
    when:
      field: classification.intent_key
      op: eq
      value: spam_or_auto
    then:
      decision: ignore
      reason: The message was classified as spam or an automated reply and requires no sales follow-up.
  - id: WHOLESALE_INQUIRY
    when:
      field: classification.intent_key
      op: eq
      value: wholesale_inquiry
    then:
      decision: needs_approval
      reason: Review the buyer’s requirements before quoting wholesale terms or promising availability.
