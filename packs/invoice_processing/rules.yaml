version: 1
rules:
  - id: BANK_DETAIL_CHANGE
    when:
      field: classification.intent_key
      op: eq
      value: bank_detail_change
    then:
      decision: escalate
      reason: Escalate supplier bank-detail changes for independent verification before changing payment instructions.
  - id: SUPPLIER_INVOICE
    when:
      field: classification.intent_key
      op: eq
      value: supplier_invoice
    then:
      decision: needs_approval
      reason: Check the supplier, invoice amount, and supporting purchase records before approving further processing.
