      {
        "key": "order_refund_eligibility",
        "name": "Order refund eligibility",
        "description": "Check eligibility for a full refund",
        "risk_level": "read",
        "requires_verified_identity": true,
        "timeout_ms": 10000,
        "input_schema": {
          "type": "object",
          "properties": {
            "order_number": {
              "type": "string",
              "pattern": "^NW-[0-9]+$"
            }
          },
          "required": [
            "order_number"
          ],
          "additionalProperties": false
        },
        "output_schema": {
          "type": "object",
          "properties": {
            "eligible": {
              "type": "boolean"
            },
            "reason": {
              "enum": [
                "eligible",
                "not_delivered",
                "window_expired",
                "already_refunded",
                "order_not_found"
              ]
            },
            "refundable_amount": {
              "type": [
                "string",
                "null"
              ],
              "pattern": "^[0-9]{1,10}\\.[0-9]{2}$"
            },
            "currency": {
              "type": [
                "string",
                "null"
              ],
              "pattern": "^[A-Z]{3}$"
            }
          },
          "required": [
            "eligible",
            "reason",
            "refundable_amount",
            "currency"
          ],
          "additionalProperties": false
        }
      },
      {
        "key": "order_refund_issue",
        "name": "Order refund",
        "description": "Issue the approved full order refund",
        "risk_level": "money",
        "requires_verified_identity": true,
        "timeout_ms": 20000,
        "input_schema": {
          "type": "object",
          "properties": {
            "order_number": {
              "type": "string",
              "pattern": "^NW-[0-9]+$"
            },
            "amount": {
              "type": "string",
              "pattern": "^[0-9]{1,10}\\.[0-9]{2}$"
            },
            "currency": {
              "type": "string",
              "pattern": "^[A-Z]{3}$"
            }
          },
          "required": [
            "order_number",
            "amount",
            "currency"
          ],
          "additionalProperties": false
        },
        "output_schema": {
          "type": "object",
          "properties": {
            "refund_reference": {
              "type": "string",
              "pattern": "^[a-f0-9-]{36}$"
            },
            "status": {
              "enum": [
                "refunded"
              ]
            }
          },
          "required": [
            "refund_reference",
            "status"
          ],
          "additionalProperties": false
        }
      }
  ]
