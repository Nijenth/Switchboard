model_list:
  - model_name: switchboard-openai
    litellm_params:
      model: openai/switchboard-fixture-openai
      api_base: http://fake-model:8080/v1
      api_key: fixture-only
      timeout: 2
      temperature: 0.2
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 512
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
  - model_name: switchboard-anthropic
    litellm_params:
      model: anthropic/claude-haiku-5-5
      api_base: http://fake-model:8080
      api_key: fixture-only
      timeout: 2
    model_info:
      max_input_tokens: 16384
      max_output_tokens: 512
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
router_settings:
  num_retries: 0
  allowed_fails: 1000
litellm_settings:
  num_retries: 0
  telemetry: false
  set_verbose: false
